[workspace]
resolver = "2"
members = ["crates/linesmith"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/oakoss/linesmith"
homepage = "https://github.com/oakoss/linesmith"
documentation = "https://docs.rs/linesmith"
readme = "README.md"
authors = ["Jace Babin"]
keywords = ["statusline", "claude-code", "claude", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
catppuccin = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
lexopt = "0.3"
supports-color = "3"
terminal_size = "0.4"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
