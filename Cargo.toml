[workspace]
resolver = "2"
members = ["crates/linesmith"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/oakoss/linesmith"
homepage = "https://github.com/oakoss/linesmith"
documentation = "https://docs.rs/linesmith"
readme = "README.md"
authors = ["Jace Babin"]
keywords = ["statusline", "claude-code", "claude", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
catppuccin = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
lexopt = "0.3"
# `sync` makes rhai::Engine Send+Sync so Arc<Engine> can thread across the
# (currently single-threaded) render path and any future daemon-mode fanout.
# `std` is required; default features like `metadata` / `serde` / `debugging`
# are not needed for our embedder and add 100s of KB to the stripped binary.
rhai = { version = "1.24", default-features = false, features = ["std", "sync"] }
supports-color = "3"
terminal_size = "0.4"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

# cargo-dist uses a 'dist' profile for release artifact builds. Inherit from
# release so the 7-target matrix gets the same size-optimized binary settings.
[profile.dist]
inherits = "release"
