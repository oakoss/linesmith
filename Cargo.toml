[workspace]
resolver = "2"
members = ["crates/linesmith"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
repository = "https://github.com/oakoss/linesmith"
authors = ["Jace Babin"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
