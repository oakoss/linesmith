[workspace]
resolver = "2"
members = ["crates/linesmith-core", "crates/linesmith-plugin", "crates/linesmith"]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/oakoss/linesmith"
homepage = "https://github.com/oakoss/linesmith"
documentation = "https://docs.rs/linesmith"
readme = "README.md"
authors = ["Jace Babin"]
keywords = ["statusline", "claude-code", "claude", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal workspace deps (linesmith-core, linesmith-plugin) live in
# each consumer's per-crate `[dependencies]` block, not here, so
# release-plz auto-bumps the version pins in lockstep with each
# crate's own version on every release. `[workspace.dependencies]`
# stays focused on shared third-party version centralization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
catppuccin = "2"
# Datetime / IANA timezone handling. Reads the system tzdb on
# macOS/Linux at runtime (no embedded IANA DB); the bundled `jiff-tzdb`
# is only linked on Windows where the OS has no system copy.
# `serde` enables `Timestamp` (de)serialization in the on-disk cache
# (RFC 3339 wire format, identical to chrono::DateTime<Utc>'s default).
jiff = { version = "0.2", default-features = false, features = ["serde", "std", "tz-system", "tzdb-bundle-platform"] }
# Interactive prompts for `linesmith init` (Select for preset/theme pickers).
# `default-features = false` drops the optional history/fuzzy-select code we
# don't use, keeping the binary smaller.
dialoguer = { version = "0.12", default-features = false }
# gix per ADR-0001. Features: repo discovery, HEAD, worktree kind,
# and status (dirty scan including untracked). No network/TLS/
# http-transport — the statusline never talks to a remote.
# `max-performance-safe` transitively enables `parallel`, which
# makes `gix::Repository: Send`.
gix = { version = "0.83", default-features = false, features = ["max-performance-safe", "status", "revision", "sha1"] }
# HTTP-date parser for `Retry-After` headers per ADR-0011 §Cache stack.
# Zero-dep, ~200 LOC — smaller than pulling chrono's HTTP-date story.
httpdate = "1"
lexopt = "0.3"
# `sync` makes rhai::Engine Send+Sync so Arc<Engine> can thread across the
# (currently single-threaded) render path and any future daemon-mode fanout.
# `std` is required; default features like `metadata` / `serde` / `debugging`
# are not needed for our embedder and add 100s of KB to the stripped binary.
rhai = { version = "1.24", default-features = false, features = ["std", "sync"] }
# JSON Schema generation for `config.toml`. Published as
# `config.schema.json` at the repo root and consumed by taplo / VS Code
# / Zed via the `#:schema` directive `linesmith init` writes.
schemars = "1"
# `SecretString` redacts on Debug/Display; we expose the inner bytes only
# through the explicit `.token()` accessor per `docs/specs/credentials.md`
# §Interface.
secrecy = "0.10"
supports-color = "3"
# OSC 8 hyperlink capability detection per ADR-0007's terminal-feature
# probing approach. Returns a single bool; we don't need the
# `supports_hyperlinks::on_cached` variant.
supports-hyperlinks = "3"
# TUI substrate for `linesmith config` per ADR-0015. Pinned to the
# `0.30` minor; bump deliberately rather than via `cargo update`. Pulled
# in via the optional `config-ui` feature on the linesmith CLI crate so
# `--no-default-features` builds drop it from the dep graph.
ratatui = "0.30"
tempfile = "3"
terminal_size = "0.4"
# ureq 3.x is the current major line — post-rewrite, sync HTTP client
# with rustls + platform trust store. `gzip`/`brotli` defaults are
# negligible for our single endpoint; leave them on for compat.
ureq = "3"
# Default features include html-report generation + plotters; dropping
# them keeps the dev-build cost down. `cargo_bench_support` is required
# for `cargo bench` interop (machine-readable output, baseline save /
# compare); the criterion book lists it as mandatory when invoked
# through the cargo harness.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
insta = "1"
# Chosen over wiremock: async-first wiremock drags tokio into the dev
# graph; mockito wraps its own runtime behind a blocking API that pairs
# cleanly with ureq's sync call().
mockito = "1"
toml = "1"
# Round-trip-preserving TOML editor used by `linesmith config`'s
# write-back path. `toml` 1.x doesn't re-export a public mutable
# document type; `toml_edit` is the maintained crate the canonical
# `toml` crate itself depends on, and it's the only way to mutate
# specific keys without losing user comments / blank lines / key
# order on save. Held as a workspace dep so the version pin moves
# in lockstep across crates.
toml_edit = "0.23"
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace.lints.rust]
# `forbid` so no per-crate `#[allow(unsafe_code)]` can reopen the door
# without an explicit manifest-level override.
unsafe_code = "forbid"
# Enforces ADR-0021 rule 6: pushes `pub` items down toward `pub(crate)`
# when their enclosing module isn't reachable from a crate root.
unreachable_pub = "warn"

[workspace.lints.clippy]
# Counterpart to `unreachable_pub` — pushes `pub(crate)` items back up
# to plain `pub` when their enclosing module is already private. The
# pair settles each item at its tightest stable visibility.
redundant_pub_crate = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

# cargo-dist uses a 'dist' profile for release artifact builds. Inherit from
# release so the 7-target matrix gets the same size-optimized binary settings.
[profile.dist]
inherits = "release"
