name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # `oakum check` reads tags and the branch's commits since the
          # merge-base; a shallow clone makes it exit 2.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: mise run fmt:check

      - name: Lint markdown
        run: mise run lint:md

      - name: Lint shell scripts
        run: mise run lint:sh

      - name: Check Rust formatting
        run: mise run cargo:fmt:check

      - name: Clippy
        run: mise run cargo:clippy

      - name: Type check
        run: mise run cargo:check

      - name: Schema drift check
        run: mise run schema:check

      # Fails a pull request whose changed crates no bump file or
      # releaseless commit covers, so a release cannot be dropped silently.
      # Skipped only on the version pull request the App opens, which
      # consumes bump files by design; a fork or a person on that branch
      # name is still checked.
      - name: oakum check
        if: >-
          github.event_name == 'pull_request'
          && (github.head_ref != 'oakum/version-packages'
            || github.event.pull_request.head.repo.full_name != github.repository
            || github.event.pull_request.user.login != 'oakoss[bot]'
            || github.event.sender.login != 'oakoss[bot]')
        run: oakum check --strict

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: mise run cargo:test

      - name: Run doc tests
        run: mise run cargo:test:doc

      # POSIX sh hooks; nothing to exercise on Windows. Running on both
      # Linux and macOS is deliberate — the watchdog's process handling is
      # where these scripts have broken before, and it differs between them.
      - name: Run shell hook tests
        if: runner.os != 'Windows'
        run: mise run test:sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Pin to Cargo.toml's declared MSRV so the `rust-version` field
      # can't silently drift past what pinned-toolchain users have.
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(grep '^rust-version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')"
          if [ -z "$version" ]; then
            echo "::error::no rust-version found in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: MSRV check
        run: cargo check --locked --workspace --all-targets

  # The release plan as a sticky pull-request comment and job summary.
  # Presentation only, so it is outside CI Summary: `oakum check` above is
  # the gate. A fork's read-only token degrades to the job summary.
  release-plan:
    name: Release plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install oakum
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: github:oakoss/oakum
          cache: true

      - name: oakum ci pr-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: oakum ci pr-status

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [static-analysis, tests, msrv]
    steps:
      # In audit mode: logs unauthorized egress without blocking; promote to
      # `egress-policy: block` once a stable allowlist emerges from runs.
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Summarize results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Required |"
            echo "| --- | --- | --- |"
            echo "| Static analysis | \`${{ needs.static-analysis.result }}\` | Yes |"
            echo "| Tests (3-OS matrix) | \`${{ needs.tests.result }}\` (per-cell status in Actions UI) | Yes |"
            echo "| MSRV | \`${{ needs.msrv.result }}\` | Yes |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          fail_unless_success() {
            if [ "$2" != "success" ]; then
              echo "Job '$1' did not succeed (result: $2)"
              exit 1
            fi
          }

          fail_unless_success "static-analysis" "${{ needs.static-analysis.result }}"
          fail_unless_success "tests" "${{ needs.tests.result }}"
          fail_unless_success "msrv" "${{ needs.msrv.result }}"
