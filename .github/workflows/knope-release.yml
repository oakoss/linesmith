name: Knope Release

# Combined prepare + release + publish pipeline. Previously split across
# knope-prepare.yml (push: main trigger) and knope-release.yml
# (pull_request: closed trigger). The split caused a race when a release
# PR merged: both workflows fired on the same event sequence, knope-prepare
# could read tag state BEFORE knope-release had created the new tag, then
# re-claim already-released commits into a phantom follow-on release PR.
#
# Combined shape: a `pull_request_target: closed` trigger driving
# prepare + release, mutually-exclusive on the merged PR's head ref, and
# a `push: tags` trigger driving publish. Only one path runs per merge.
# `workflow_dispatch` provides operator escape hatches for recovery and
# the edge case where a commit lands on main without going through a PR;
# a `mode=release` dispatch is the one case where release and publish
# both run, and its tags then fire further publish runs on top.
#
# Publish is split onto the tag trigger because crates.io refuses to
# exchange the OIDC token for a publish token on `pull_request_target`
# and `workflow_run` — rust-lang/crates.io#12219, 2025-10-29. (GitHub
# still mints the JWT; the 400 comes back from crates.io, which is where
# to look when this breaks.) Those two are the whole denylist, not an
# allowlist of three: both are triggerable from forks while running in
# the target repo's security context. Full rationale lives in
# docs/specs/release-process.md §Crates.io publishing.

# `pull_request_target` (not `pull_request`) so the workflow can mint
# the bot's GitHub App token on merged fork PRs. `pull_request` strips
# secrets when the PR head is on a fork, which would break prepare for
# any external contribution. Safe here because we only react to
# `closed + merged == true` (maintainer-approved merge) and the
# checkout default is the base branch (main), not the PR head — we
# never execute contributor code with elevated perms.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  # Knope's per-package tag format (`<crate>/v<ver>`). `*` doesn't cross
  # `/`, so this matches exactly one package segment.
  #
  # No trailing `*`, unlike `release.yml`'s `linesmith/v…*`: that one
  # keeps it so cargo-dist builds prereleases, but a crates.io publish
  # is irreversible and the runbook's hand-cut RC tags are documented as
  # not publishing (release-runbook.md §Pre-release, release-process.md
  # §Pre-release). Knope emits only plain `<pkg>/vX.Y.Z`, so matching
  # exact versions loses nothing.
  push:
    tags:
      - '*/v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare | release (default; tag + publish) | publish (skip tag, publish only — recovery for partial runs)'
        type: choice
        options: [prepare, release, publish]
        default: release

# Zero default permissions; each job declares the minimum it needs.
permissions: {}

# Footgun reminder for future edits: `inputs.<name>` is unset (empty
# string) on non-dispatch events. Conditions like `inputs.mode != 'prepare'`
# evaluate to true on PR events because `'' != 'prepare'`. Always pair
# `inputs.*` checks with `github.event_name == 'workflow_dispatch'`.

jobs:
  # knope prepare-release walks tags + conventional commits since each
  # package's last <pkg>/v* tag, bumps versioned files, prepends CHANGELOG
  # entries, and opens/updates the `release` PR.
  prepare:
    name: Prepare release PR
    # Fires on any merged non-release PR. The two-part head filter
    # excludes ONLY our own `release` branch (which the release job
    # handles); a fork PR coincidentally named `release` still gets
    # picked up here because its head.repo.full_name is different
    # from this repo. Without the repo-comparison part, a fork PR
    # named `release` would fall through both prepare (filtered out
    # by name) and release (filtered out by repo) — its commit
    # would land on main without driving a release-prep run.
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       !(github.event.pull_request.head.ref == 'release' &&
         github.event.pull_request.head.repo.full_name == github.repository)) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release branch's blobs/trees/commit via the API
      pull-requests: write # open and update the release PR
    # Shares the `knope-release` group with the release job.
    # If a fix/feat PR merges while a release PR's release job is
    # mid-tagging, the prepare job for the fix PR queues behind the
    # release-job's tag creation — without the shared lock, prepare
    # would walk stale tag state and re-claim the in-flight release's
    # commits into a phantom follow-on release PR (same failure mode
    # the workflow-combine eliminates for the same-event case).
    concurrency:
      group: knope-release
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # Symmetric with the release + publish jobs' guards: a
      # `gh workflow run knope-release.yml --ref <branch> -f mode=prepare`
      # would otherwise let Knope compute "changes since last tag" off
      # a non-main commit and push to `release` from the wrong base.
      - name: Reject non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::knope-release.yml dispatch must target refs/heads/main; got ${{ github.ref }}" >&2
          exit 1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pin to the specific merge commit on `pull_request_target`
          # events, falling back to `main` for `workflow_dispatch`.
          # Plain `ref: main` would resolve to whatever `main` points
          # to at checkout time — if a second PR merges between this
          # workflow firing and this step running, the checkout would
          # land on the wrong SHA and Knope would walk tags + commits
          # the maintainer didn't intend to include in this run.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || 'main' }}
          # PrepareRelease walks every tag + conventional commit since
          # the last release.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.4

      # Knope reads `<pkg>/v<ver>` tags to compute "what's changed since
      # the last release"; all three packages must have at least one. A
      # core/plugin-only first release without its migration tag would
      # otherwise scan the entire repo history for that package's
      # changelog. One-time setup: docs/ops/release-runbook.md §Knope
      # migration tags.
      - name: Verify migration tags exist
        run: |
          missing=()
          for pkg in linesmith linesmith-core linesmith-plugin; do
            if ! git tag --list "${pkg}/v*" | grep -q .; then
              missing+=("${pkg}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing migration tag(s): ${missing[*]} — run docs/ops/release-runbook.md §Knope migration tags before enabling this workflow." >&2
            exit 1
          fi

      # `PrepareRelease` has no commit step, so the version bumps,
      # CHANGELOG entries, and consumed changeset deletions land in the
      # working tree uncommitted; the action below turns them into the
      # PR. Separately, `allow_empty = true` stops Knope erroring when
      # nothing is releasable, which is what keeps every non-release
      # merge green — the two are unrelated, don't fold them together.
      - name: Run knope prepare-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: knope prepare-release --verbose

      # Knope's own publish step could only commit through shell `git`,
      # and git-pushed commits are unsigned whatever the token — which
      # `required_signatures` on main then blocks, leaving the release PR
      # mergeable only by bypassing the rule (lsm-g5xz). This action
      # commits through the GitHub API so the commit is signed as the
      # bot, and builds real tree objects, so file modes and deletions
      # survive (the `createCommitOnBranch` mutation has no mode field).
      # It is idempotent: it updates the existing `release` PR as further
      # changes accumulate, and exits silently when there is nothing to
      # release, which is what the old `git diff --quiet` gate did.
      - name: Open or update the release PR
        id: release-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: release
          base: main
          commit-message: 'chore: prepare release'
          title: 'chore: prepare release'
          body: |
            Automated release PR. Merging tags each bumped package and triggers cargo-dist's binary build for `linesmith`. Review the per-package CHANGELOG entries in the diff to confirm the bump shape is correct.

      # Signing is the entire point of using the action, and it is the
      # kind of thing that fails quietly: an unsigned release PR looks
      # normal until the merge button is red. Assert it instead.
      #
      # Gate on the operation, not on `pull-request-number` or on the
      # verified output being non-empty. When a run leaves the branch
      # untouched (an open release PR, nothing new to bump — any docs or
      # ci merge), the action still reports a PR number and falls back to
      # reading `%G?` off the *local* commit. Under `sign-commits` that
      # commit is never GPG-signed, since the signature exists only on
      # the API-created object, so the output reads `false` and this step
      # would call a perfectly good release PR unmergeable.
      - name: Verify the release commit is signed
        if: contains(fromJSON('["created","updated"]'), steps.release-pr.outputs.pull-request-operation)
        run: |
          if [ "${{ steps.release-pr.outputs.pull-request-commits-verified }}" != "true" ]; then
            echo "::error::release PR #${{ steps.release-pr.outputs.pull-request-number }} has unverified commits; it will not be mergeable without bypassing required_signatures" >&2
            exit 1
          fi
          echo "release PR #${{ steps.release-pr.outputs.pull-request-number }} commits verified"

  # `knope release` tags each bumped package and creates per-package
  # GitHub Releases. The `linesmith/v*` tag push triggers cargo-dist's
  # release.yml, which uploads binaries to the existing release.
  release:
    name: Tag + create GitHub releases
    # `release` is the branch the prepare job pushes to; restricting
    # the merged PR's head ref keeps generic PR merges from firing
    # this job. The `head.repo.full_name == github.repository` guard
    # is load-bearing under `pull_request_target`: a fork can name
    # its source branch anything (including `release`), so
    # `head.ref == 'release'` alone would match a coincidentally-
    # named fork branch and mint the bot's token to tag commits the
    # maintainer didn't intend to release. The prepare job has a
    # complementary `!(head.ref == 'release' && head.repo == ours)`
    # filter so fork PRs (including a fork branch named `release`)
    # still drive release prep — only our own `release` branch is
    # excluded, since that's what THIS job handles.
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push tags + create GitHub Releases
    concurrency:
      group: knope-release
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # Dispatch-ref guard runs before setup so a `gh workflow run
      # --ref <feature-branch>` mistake fails fast — otherwise we'd
      # tag + create GitHub Releases off a non-main commit before
      # the guard could fire, leaving stale tags to clean up by hand.
      - name: Reject non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::knope-release.yml dispatch must target refs/heads/main; got ${{ github.ref }}" >&2
          exit 1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # See prepare job's checkout for the rationale: pin to the
          # PR's merge commit on `pull_request_target` events so a
          # later merge can't shift the SHA between trigger and
          # checkout, falling back to `main` for `workflow_dispatch`.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.4

      - name: Create tags + GitHub Releases
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: knope release --verbose

  # Asserts the registry received the release. Deliberately a sibling of
  # `publish` rather than a step inside it: publish runs in a
  # separate tag-triggered run, and every way that run can fail to happen
  # at all — evicted from its concurrency group, tag glob stopped
  # matching, App token lost push-triggers-workflows semantics — would
  # take a step inside it down too. This job rides the
  # `pull_request_target` merge run, which fires whenever a release PR
  # merges, so it survives the failures it exists to catch.
  #
  # Before this existed the pipeline was green, the GitHub Release said
  # "Latest", and crates.io stayed on the previous version for two months
  # (lsm-9wrv). That is the shape of failure this turns red.
  verify-published:
    name: Verify crates.io received the release
    # `needs` for ordering only — deliberately no `needs.*.result` gate,
    # unlike publish. `release` shares the `knope-release` group, so a
    # `prepare` run queuing while `release` is itself still pending
    # evicts it, and that lands as a cancelled job: gray, not red.
    # Gating on success-or-skipped would skip this job exactly then, and
    # again when `release` dies after creating only some tags — which is
    # half-shipped by definition and precisely when the per-crate missing
    # list earns its keep. The job only reads manifests and the registry,
    # so it is correct however its dependencies ended.
    #
    # `always()` rather than `!cancelled()`: `cancelled()` is documented
    # against the *workflow*, and whether an evicted job flips that is
    # ambiguous enough that relying on it could skip the one job whose
    # entire purpose is not being skippable. The event conditions below
    # already scope this precisely.
    needs: [release, publish]
    if: |
      always() &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'release' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'release' || inputs.mode == 'publish')))
    runs-on: ubuntu-latest
    # 20-minute poll plus headroom for checkout and toolchain setup;
    # the script self-terminates at its own deadline, so this never binds.
    timeout-minutes: 30
    permissions:
      contents: read
    # No concurrency group on purpose. This job only reads, and parking
    # it in `knope-release` would block prepare runs for the length of
    # the poll.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # Same dispatch-ref guard the other jobs carry. Without it, a
      # `--ref some-branch -f mode=publish` dispatch has publish exit 1
      # while this job reads main's manifests — already on crates.io —
      # and reports success, which is the misreading it exists to stop.
      - name: Reject non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::knope-release.yml dispatch must target refs/heads/main; got ${{ github.ref }}" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Plain `main`, not the PR's `merge_commit_sha` that prepare and
          # release pin to. Those two need the exact SHA so Knope can't
          # walk commits from a PR that merged in between; this job only
          # reads version strings, and nothing but a release PR changes
          # them, so `main` is equivalent in practice. It also keeps a
          # `pull_request_target` job from checking out a PR-derived ref
          # and then running cargo over it — CodeQL's untrusted-checkout
          # rule, and a fair objection even though the job's `if:` already
          # restricts it to our own `release` branch.
          ref: main
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      # Versions come from the manifests on `main`, not from the tag
      # names, so a tag that disagrees with what was built is caught
      # rather than trusted.
      - name: Wait for crates.io to serve every released version
        shell: bash
        run: |
          # Its own statement so `set -e` catches a broken toolchain or
          # unparseable manifest directly. Folded into the mapfile,
          # process substitution swallows the status and the failure
          # resurfaces only as the vaguer empty-array error below.
          metadata="$(cargo metadata --no-deps --format-version 1)"

          # `publish` is null when publishable, [] for `publish = false`,
          # and a registry list when restricted. Only the first and an
          # explicit crates-io entry belong here — a crate restricted to
          # another registry can never appear on this index and would
          # poll to the deadline before firing a spurious red.
          mapfile -t packages < <(
            jq -r '.packages[]
                   | select(.publish == null or (.publish | index("crates-io")))
                   | "\(.name) \(.version)"' <<<"$metadata"
          )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::cargo metadata reported no crates-io-publishable workspace members; the check would pass vacuously" >&2
            exit 1
          fi
          printf 'expecting on crates.io:\n'
          printf '  %s\n' "${packages[@]}"

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          # 20 minutes: publish runs asynchronously and took ~4.5min on
          # the 0.3.0 release, plus sparse-index propagation.
          deadline=$(( $(date +%s) + 20 * 60 ))
          while :; do
            missing=()
            transient=0
            for entry in "${packages[@]}"; do
              name="${entry%% *}"
              version="${entry##* }"
              # Sparse-index layout for names of 4+ chars, and the index
              # lowercases names. Every crate here is long and already
              # lowercase; one that wasn't would 404, then burn the full
              # poll and be misreported as half-shipped.
              url="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
              # Branch on `%{http_code}` rather than adding `-f` and
              # reading curl's exit code: under `-f` a 404 surfaces as an
              # HTTP-error exit whose value depends on the negotiated
              # protocol (22 on HTTP/1.1, 56 on HTTP/2, and the index
              # serves h2), which would file a genuinely missing crate
              # under "transient". Without `-f`, curl exits 0 on a 404
              # and the status carries the whole signal.
              #
              # `|| true` keeps `set -e` out of it; `-w` prints 000 when
              # the request doesn't complete, and the `:-000` covers curl
              # failing to execute at all, where the substitution is
              # empty rather than 000. curl's stderr stays visible in the
              # run log for diagnosis.
              http="$(curl -sS --max-time 30 -o "$body_file" -w '%{http_code}' "$url" || true)"
              http="${http:-000}"
              case "$http" in
                200)
                  # `yanked == false` too: the index keeps yanked
                  # versions listed forever, so matching on `vers` alone
                  # would call a release users cannot install a success.
                  jq -e --arg v "$version" \
                    'select(.vers == $v and .yanked == false)' >/dev/null <"$body_file" ||
                    missing+=("${name} ${version}")
                  ;;
                404)
                  missing+=("${name} ${version}")
                  ;;
                *)
                  # 5xx, 429, or no response at all: not evidence of a
                  # failed publish, so don't let the deadline message
                  # claim the release is half-shipped.
                  transient=1
                  missing+=("${name} ${version} (http ${http})")
                  ;;
              esac
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "all released versions are live on crates.io"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$transient" -eq 1 ]; then
                echo "::error::gave up waiting on crates.io for: ${missing[*]}. At least one probe failed at the transport level, so this may be a registry or network outage rather than a publish failure — confirm against the index before running any recovery." >&2
              else
                echo "::error::crates.io is still missing: ${missing[*]}. The tags and GitHub Release exist, so this release is half-shipped — check the publish run, then recover with: gh workflow run \"Knope Release\" -f mode=publish" >&2
              fi
              exit 1
            fi

            echo "waiting on: ${missing[*]}"
            sleep 30
          done

  # crates.io publish runs off the tags Knope created, or on a
  # `mode=release` / `mode=publish` dispatch — the latter recovering a
  # partial run where tags already exist. cargo's leaf-first publish
  # order (since 1.90) sequences linesmith-plugin → linesmith-core →
  # linesmith automatically; ADR-0019's "linesmith-core as scaffolding"
  # posture depends on this.
  publish:
    name: Publish to crates.io
    needs: [release]
    # The `needs.release` clause does its real work only on a
    # `mode=release` dispatch, where it blocks publishing after Knope
    # crashed mid-tag. On `push` and on a `mode=publish` recovery
    # dispatch `release` is always skipped, so the clause is satisfied
    # trivially — it is not a safety property of those paths. If
    # `release` is ever made runnable on `push`, revisit this: as
    # written it would degrade to "publish regardless".
    # `!cancelled()` rather than `always()`: cancellation is load-bearing
    # here. The `knope-publish` group's safety story is that evicted runs
    # get cancelled, and cancelling a tag-triggered run is the only kill
    # switch for an in-flight crates.io push, which is irreversible.
    # `always()` would run through both.
    if: |
      !cancelled() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'release' || inputs.mode == 'publish')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `id-token: write` mints the OIDC crates.io token per release-process
    # spec §Crates.io publishing. Trusted-publisher entries name this
    # workflow (knope-release.yml) with no environment requirement, so
    # the workflow filename alone is sufficient identity.
    permissions:
      id-token: write
      contents: read
    # Deliberately NOT the `knope-release` group that prepare + release
    # share. Under the default `queue`, a group holds one running plus
    # one pending — "By default, any existing pending job or workflow in
    # the same concurrency group will be canceled and the new queued job
    # or workflow will take its place". Eviction is governed by `queue`,
    # not by `cancel-in-progress`, which only additionally cancels
    # running jobs. On a shared group, a `prepare` run from an unrelated
    # PR merge landing while publish sits pending would evict it, and the
    # release would silently never reach crates.io: exactly the failure
    # this trigger split exists to fix.
    #
    # A dedicated group still serialises publish against publish (two
    # concurrent `cargo release publish --workspace` runs would race on
    # the same versions), and every run in it is a publish run, so
    # whichever survives eviction does the work. That last part holds
    # only because Knope bumps every package in one release commit, so
    # all of a cycle's tags point at the same SHA and any one of them
    # checks out the full set of new versions.
    concurrency:
      group: knope-publish
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # Dispatch-ref guard runs before the expensive setup steps below
      # so a `gh workflow run --ref <branch>` mistake fails fast instead
      # of burning a runner on checkout + cargo-install. The `push` path
      # has its own provenance guard after checkout.
      - name: Reject non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::knope-release.yml dispatch must target refs/heads/main; got ${{ github.ref }}" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Publish the exact tagged commit on `push`; `main` on
          # dispatch. Reading `main` on a tag event would publish
          # whatever landed since the tag rather than the reviewed
          # release state. The dispatch branch does read `main` and so
          # carries exactly that risk: if main has moved past the
          # release, a `mode=publish` recovery finds every version
          # already published and exits green having published nothing.
          # Accepted for now as operator-driven; lsm-7ihh tracks giving
          # dispatch a tag input.
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          # Ancestry check below needs history on both sides.
          fetch-depth: 0
          persist-credentials: false

      # The old `pull_request_target` gate required a merged `release`
      # PR, so only commits that reached main could publish. A tag
      # trigger alone is weaker — any tag matching the filter would do,
      # including one pointing at an unreviewed commit. Re-establish the
      # property explicitly rather than relying on tag-push permissions.
      - name: Verify tag is an ancestor of main
        if: github.event_name == 'push'
        # `shell: bash` adds `-o pipefail`; the default `bash -e {0}` doesn't.
        shell: bash
        run: |
          # Compare against FETCH_HEAD, not `origin/main`: a bare
          # `git fetch origin main` always writes FETCH_HEAD, but only
          # updates the remote-tracking ref when the remote's configured
          # refspec covers it, so `origin/main` can be stale here.
          git fetch --quiet origin main
          tag_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          # Log both sides so a future failure is diagnosable from the
          # run alone, without re-resolving refs that may have moved.
          echo "tag ${{ github.ref }} -> ${tag_sha}"
          echo "origin/main          -> ${main_sha}"
          if ! git merge-base --is-ancestor "$tag_sha" "$main_sha"; then
            echo "::error::${{ github.ref }} points at a commit that is not on main; refusing to publish" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Mint crates.io OIDC token
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      # `cargo publish --workspace` has no `--skip-existing`, so a
      # single-package release cycle errors when it reaches the unchanged
      # siblings. `cargo release publish` skips already-published members
      # and publishes the rest leaf-first (same pattern as Knope's own
      # publish_crates.yml). Version is pinned so a future upstream
      # behavior change in the skip path surfaces in PR review rather
      # than breaking partial-publish recovery silently. Bump it by hand:
      # nothing updates it automatically, since Renovate's managers read
      # `uses:`, never `run:` bodies.
      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked

      # `cargo release publish` doesn't forward `--locked` to its
      # underlying `cargo publish` invocations, so a stale Cargo.lock
      # from a Knope `versioned_files` miss could resolve a different
      # dep graph than the release-PR-reviewed state. Fail here before
      # an irreversible publish.
      - name: Verify lockfile matches manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      # `--allow-branch 'main,HEAD'`: both entries are load-bearing.
      # The `push` path checks out `refs/tags/<pkg>/v<ver>`, which
      # detaches HEAD, and cargo-release 1.1.2 reads that as branch
      # `HEAD`. The `workflow_dispatch` path passes the literal `'main'`
      # ref name, so the checkout lands on the `main` branch. Dropping
      # `HEAD` would break every tag-triggered publish.
      - name: Publish bumped crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo release publish --workspace --execute --no-confirm --allow-branch 'main,HEAD'
