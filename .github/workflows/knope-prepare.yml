name: Knope Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Zero default permissions; the job mints a GitHub App installation
# token scoped to this repo per docs/specs/release-process.md §Supply-chain.
permissions: {}

jobs:
  prepare-release:
    name: Prepare release PR
    # Skip the workflow's own prepare-release commits. Author-identity
    # tolerates subject collisions ("chore: prepare release notes
    # template") and squash-merges that rewrite the subject but keep
    # the bot's authorship. `head_commit` is null on workflow_dispatch,
    # so the guard reduces to `true` and the manual path fires.
    if: github.event.head_commit.author.email != 'linesmith-bot[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update the release PR
    concurrency:
      group: knope-prepare
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PrepareRelease walks every tag + conventional commit since
          # the last release; depth-0 is mandatory.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "linesmith-bot[bot]"
          git config user.email "linesmith-bot[bot]@users.noreply.github.com"

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.4

      # Knope reads `<pkg>/v<ver>` tags to compute "what's changed since
      # the last release"; all three packages must have at least one. A
      # core/plugin-only first release without its migration tag would
      # otherwise scan the entire repo history for that package's
      # changelog. One-time setup: docs/ops/release-runbook.md §Knope
      # migration tags.
      - name: Verify migration tags exist
        run: |
          missing=()
          for pkg in linesmith linesmith-core linesmith-plugin; do
            if ! git tag --list "${pkg}/v*" | grep -q .; then
              missing+=("${pkg}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing migration tag(s): ${missing[*]} — run docs/ops/release-runbook.md §Knope migration tags before enabling this workflow." >&2
            exit 1
          fi

      # Two-step invocation mirrors knope.toml's workflow split:
      # `prepare-release` stages bumps with `allow_empty = true`, then a
      # `git diff --quiet` gate decides whether `publish-release-pr` runs.
      # No-op pushes land as green runs without a spurious PR; real Knope
      # errors still fail the job loudly.
      - name: Run knope prepare-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: knope prepare-release --verbose

      - name: Publish release PR (skip on no-op)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet HEAD; then
            echo "PrepareRelease found no releasable changes; skipping PR publish."
            exit 0
          fi
          knope publish-release-pr --verbose
