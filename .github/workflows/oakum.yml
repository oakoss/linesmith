name: oakum

# Release automation per ADR-0033, which supersedes ADR-0027's Knope
# pipeline. Three paths, each gated on its own event:
#
# - push to main: `release` tags every manifest version that has no tag yet
#   and creates its GitHub Release, then `version` opens or refreshes the
#   version pull request (`oakum/version-packages`) from pending bump files,
#   then `verify-published` asserts crates.io serves what main declares.
# - push of a `<crate>/vX.Y.Z` tag: `publish` pushes the workspace to
#   crates.io. The tag `release` pushes is what fires it.
# - workflow_dispatch with a tag: `publish` recovers a release whose tags and
#   GitHub Release exist but whose crates.io publish did not finish.
#
# Publish runs on the tag push, not in the main-push run, because crates.io
# refuses to exchange the OIDC token for a publish token on
# `pull_request_target` and `workflow_run` (rust-lang/crates.io#12219), and
# a dedicated trigger keeps the irreversible step separately cancellable.
# The crates.io trusted-publisher entries name this file. Full rationale:
# docs/specs/release-process.md §Crates.io publishing.
on:
  push:
    branches: [main]
    # `*` doesn't cross `/`, so this matches exactly one package segment. No
    # trailing `*`, unlike release.yml's `linesmith/v…*`: that one keeps it so
    # cargo-dist builds prereleases, but a crates.io publish is irreversible
    # and the runbook's hand-cut RC tags are documented as not publishing.
    tags:
      - '*/v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. linesmith/v0.5.0 (crates.io recovery)'
        type: string
        required: true

# Zero default permissions; each job declares the minimum it needs.
permissions: {}

jobs:
  # Nothing to tag is a no-op, so a rerun is the recovery for a partial run.
  release:
    name: Tag + create GitHub releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Shared with `version`, so a version pull request is never computed
    # from tag state a concurrent release is still writing.
    concurrency:
      group: oakum-release
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # The App token, not GITHUB_TOKEN: tags pushed with GITHUB_TOKEN start
      # no workflows, so neither release.yml nor `publish` would run.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      # Pinned to the pushed commit, not `main`: a later push between this
      # run firing and checking out would otherwise tag a commit this run
      # was not started for. The tags are pushed over these credentials.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install oakum
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: github:oakoss/oakum
          cache: true

      - name: Configure git as the App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: oakum release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: oakum release

  version:
    name: Version pull request
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: oakum-release
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # The App token: a pull request opened with GITHUB_TOKEN starts no CI,
      # so the version pull request could never pass its required checks.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install oakum
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: github:oakoss/oakum
          cache: true

      # When main has moved past this run's commit, this prints
      # `superseded` and exits 0; the newer push's run versions it.
      - name: oakum ci version-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: oakum ci version-pr

  # Asserts the registry received what main declares. A sibling of `publish`
  # rather than a step inside it: publish runs in a separate tag-triggered
  # run, and every way that run can fail to happen at all — evicted from its
  # concurrency group, tag glob stopped matching, the tags pushed without
  # the App token — would take a step inside it down too. This job rides the
  # push to main, so it survives the failures it exists to catch. On a push
  # that releases nothing every version is already live and it passes on
  # the first probe.
  #
  # Before this existed the pipeline was green, the GitHub Release said
  # "Latest", and crates.io stayed on the previous version for two months
  # (lsm-9wrv). That is the shape of failure this turns red.
  verify-published:
    name: Verify crates.io received the release
    # `needs` for ordering only, with no result gate: when `release` dies
    # after creating only some tags the release is half-shipped by
    # definition, and that is precisely when the per-crate missing list
    # earns its keep. The job only reads manifests and the registry, so it
    # is correct however `release` ended. `always()` rather than
    # `!cancelled()`, so this one job is never the one skipped.
    needs: [release]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 20-minute poll plus headroom for checkout and toolchain setup;
    # the script self-terminates at its own deadline, so this never binds.
    timeout-minutes: 30
    permissions:
      contents: read
    # No concurrency group on purpose: this job only reads, and parking it in
    # `oakum-release` would block the version job for the length of the poll.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # The dispatch-ref guard `publish` carries. Without it, a
      # `--ref some-branch -f tag=…` dispatch has publish exit 1 while this
      # job reads the tag's manifests — already on crates.io — and reports
      # success, which is the misreading it exists to stop.
      - name: Reject non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::oakum.yml dispatch must target refs/heads/main; got ${{ github.ref }}" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # What this run released or recovers: the pushed commit, or the
          # tag a recovery names. Reading `main` instead would verify
          # whatever main holds by the time this job starts (lsm-d2a9.2).
          # `cargo metadata --no-deps` runs no build scripts.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      # Versions come from the manifests, not from tag names, so a tag that
      # disagrees with what was built is caught rather than trusted.
      - name: Wait for crates.io to serve every released version
        shell: bash
        run: |
          # `shell: bash` supplies -eo pipefail but not -u. This job
          # passes when every bucket is empty, so an unset or misspelled
          # array name would expand to nothing and go green — the same
          # shape as a missed release.
          set -u

          # Its own statement so `set -e` catches a broken toolchain or
          # unparseable manifest directly. Folded into the mapfile,
          # process substitution swallows the status and the failure
          # resurfaces only as the vaguer empty-array error below.
          metadata="$(cargo metadata --no-deps --format-version 1)"

          # `publish` is null when publishable, [] for `publish = false`,
          # and a registry list when restricted. Only the first and an
          # explicit crates-io entry belong here — a crate restricted to
          # another registry can never appear on this index and would
          # poll to the deadline before firing a spurious red.
          # Declared before `mapfile` so `set -u` can't turn a zero-match
          # read into an "unbound variable" abort, which would pre-empt
          # the empty-set guard below and its diagnostic.
          packages=()
          mapfile -t packages < <(
            jq -r '.packages[]
                   | select(.publish == null or (.publish | index("crates-io")))
                   | "\(.name) \(.version)"' <<<"$metadata"
          )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::cargo metadata reported no crates-io-publishable workspace members; the check would pass vacuously" >&2
            exit 1
          fi
          printf 'expecting on crates.io:\n'
          printf '  %s\n' "${packages[@]}"

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          # 20 minutes: publish runs asynchronously and took ~4.5min on
          # the 0.3.0 release, plus sparse-index propagation.
          deadline=$(( $(date +%s) + 20 * 60 ))
          while :; do
            missing=()
            yanked=()
            transient=0
            for entry in "${packages[@]}"; do
              name="${entry%% *}"
              version="${entry##* }"
              # Sparse-index layout for names of 4+ chars, and the index
              # lowercases names. Every crate here is long and already
              # lowercase; one that wasn't would 404, then burn the full
              # poll and be misreported as half-shipped.
              url="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
              # Branch on `%{http_code}` rather than adding `-f` and
              # reading curl's exit code: under `-f` a 404 surfaces as an
              # HTTP-error exit whose value depends on the negotiated
              # protocol (22 on HTTP/1.1, 56 on HTTP/2, and the index
              # serves h2), which would file a genuinely missing crate
              # under "transient". Without `-f`, curl exits 0 on a 404
              # and the status carries the whole signal.
              #
              # curl only truncates the output file once a response starts
              # arriving, so a request that never completes leaves the
              # previous crate's body in place. This file is reused across
              # crates and polls, and two workspace members can share a
              # version, so a stale body reads as a plausible wrong
              # answer. Truncate first.
              : >"$body_file"
              # `-w` prints 000 when the request doesn't complete; `:-000`
              # covers curl failing to execute at all, where the
              # substitution is empty rather than 000. The exit status is
              # captured rather than discarded: a transfer can break
              # mid-body after a 200 (curl 18, PARTIAL_FILE), leaving a
              # truncated body that must not read as evidence. curl's
              # stderr stays visible in the log for diagnosis.
              curl_rc=0
              http="$(curl -sS --max-time 30 -o "$body_file" -w '%{http_code}' "$url")" || curl_rc=$?
              http="${http:-000}"
              case "$http" in
                200)
                  # The index keeps yanked versions listed forever, so an
                  # exact `vers` match isn't proof the release installs.
                  # Yanked gets its own bucket rather than folding into
                  # missing: the two need opposite recoveries, and the
                  # publish rerun offered below can't clear a yank.
                  #
                  # Both arms test `.yanked` against an explicit literal
                  # so the fallthrough is red. `.yanked` truthiness or a
                  # bare `vers` match would pass an entry whose `yanked`
                  # is null, absent, or non-boolean — turning an
                  # unreadable index into a green light for the one
                  # check meant to catch a stale registry.
                  if [ "$curl_rc" -ne 0 ]; then
                    # 200 with a broken transfer: incomplete body, so
                    # treat it as transient, not a failed publish.
                    transient=1
                    missing+=("${name} ${version} (truncated response, curl ${curl_rc})")
                  elif jq -e --arg v "$version" \
                      'select(.vers == $v and .yanked == true)' >/dev/null <"$body_file"; then
                    yanked+=("${name} ${version}")
                  elif ! jq -e --arg v "$version" \
                      'select(.vers == $v and .yanked == false)' >/dev/null <"$body_file"; then
                    missing+=("${name} ${version}")
                  fi
                  ;;
                404)
                  missing+=("${name} ${version}")
                  ;;
                *)
                  # 5xx, 429, or no response at all: not evidence of a
                  # failed publish, so don't let the deadline message
                  # claim the release is half-shipped.
                  transient=1
                  missing+=("${name} ${version} (http ${http})")
                  ;;
              esac
            done

            # Fails immediately instead of polling: a yank is a
            # deliberate act that no amount of waiting reverses.
            if [ "${#yanked[@]}" -ne 0 ]; then
              echo "::error::yanked on crates.io: ${yanked[*]}. These versions exist but cannot be installed, and republishing is not a recovery — crates.io rejects a version it already has. Either restore them with 'cargo yank --undo --version <version> <crate>', or cut a new release." >&2
              # Report the other buckets before bailing, so a run with
              # both a yank and an unpublished crate doesn't send the
              # operator round the loop twice.
              if [ "${#missing[@]}" -ne 0 ]; then
                echo "::error::also not yet live on crates.io: ${missing[*]}" >&2
              fi
              exit 1
            fi

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "all released versions are live on crates.io"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              if [ "$transient" -eq 1 ]; then
                echo "::error::gave up waiting on crates.io for: ${missing[*]}. At least one probe failed at the transport level, so this may be a registry or network outage rather than a publish failure — confirm against the index before running any recovery." >&2
              else
                echo "::error::crates.io is still missing: ${missing[*]}. If the tags and GitHub Release exist, this release is half-shipped — check the publish run, then recover with: gh workflow run oakum.yml -f tag=<crate>/v<version> (recovery publishes that tag's commit, not main). If the tags are missing, rerun this workflow's failed jobs: \`oakum release\` tags whatever main declares that has no tag yet." >&2
              fi
              exit 1
            fi

            echo "waiting on: ${missing[*]}"
            sleep 30
          done

  # crates.io publish runs off the tags `release` created, or on a dispatch
  # naming a tag — recovering a partial run where tags already exist.
  # cargo's leaf-first publish order (since 1.90) sequences
  # linesmith-plugin → linesmith-core → linesmith automatically; ADR-0019's
  # "linesmith-core as scaffolding" posture depends on this.
  publish:
    name: Publish to crates.io
    # `!cancelled()` rather than `always()`: cancelling a tag-triggered run
    # is the only kill switch for an in-flight crates.io push, which is
    # irreversible.
    if: |
      !cancelled() &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `id-token: write` mints the OIDC crates.io token per release-process
    # spec §Crates.io publishing. Trusted-publisher entries name this
    # workflow (oakum.yml) with no environment requirement, so the workflow
    # filename alone is sufficient identity.
    permissions:
      id-token: write
      contents: read
    # Deliberately not `oakum-release`. Under the default `queue`, a group
    # holds one running plus one pending — "By default, any existing pending
    # job or workflow in the same concurrency group will be canceled and the
    # new queued job or workflow will take its place". On a shared group, a
    # release run from an unrelated push landing while publish sits pending
    # would evict it, and the release would silently never reach crates.io.
    #
    # A dedicated group still serialises publish against publish (two
    # concurrent `cargo release publish --workspace` runs would race on the
    # same versions). Every tag of one release points at the same version
    # commit, so whichever run survives eviction publishes the same thing.
    # A recovery dispatch is a run in this group pinned to an arbitrary
    # commit, so it can evict a pending tag-push publish for the current
    # release and then publish something older. `lsm-rurz` tracks the effect
    # assertion that turns the surviving run red; until it lands, avoid
    # dispatching a recovery while a release is in flight.
    concurrency:
      group: oakum-publish
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # Dispatch-ref guard runs before the expensive setup steps below
      # so a `gh workflow run --ref <branch>` mistake fails fast instead
      # of burning a runner on checkout + cargo-install. The `push` path
      # has its own provenance guard after checkout.
      - name: Reject non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::oakum.yml dispatch must target refs/heads/main; got ${{ github.ref }}" >&2
          exit 1

      # One step decides what this run publishes; the checkout and the
      # ancestry guard both read its output, so the two cannot drift. Every
      # arm is explicit and the fallthrough denies.
      - name: Resolve publish ref
        id: publish-ref
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          case "$EVENT" in
            push)
              resolved="$PUSHED_REF"
              ;;
            workflow_dispatch)
              # Same shape the push trigger's glob accepts. That glob
              # deliberately omits a trailing `*` so hand-cut RC tags
              # cannot drive an irreversible publish; without this
              # check the dispatch input would be a way around it.
              if ! printf '%s' "$TAG" | grep -Eq '^[^/]+/v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::tag must be <crate>/vX.Y.Z, matching the push trigger's glob; got '${TAG}'. Prerelease tags deliberately do not publish." >&2
                exit 1
              fi
              resolved="refs/tags/${TAG}"
              ;;
            *)
              echo "::error::publish reached on unsupported event '${EVENT}'; refusing to guess a ref" >&2
              exit 1
              ;;
          esac
          echo "ref=${resolved}" >>"$GITHUB_OUTPUT"
          echo "publishing from ${resolved}"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.publish-ref.outputs.ref }}
          # Ancestry check below needs history on both sides.
          fetch-depth: 0
          persist-credentials: false

      # A tag trigger alone would publish any tag matching the filter,
      # including one pointing at an unreviewed commit. Re-establish that
      # only commits on main publish, rather than relying on tag-push
      # permissions. Deliberately carries no `if:`: a guard that opts out of
      # running is a guard whose condition has to be kept in sync by hand.
      - name: Verify publish ref is an ancestor of main
        env:
          PUBLISH_REF: ${{ steps.publish-ref.outputs.ref }}
        # `shell: bash` adds `-o pipefail`; the default `bash -e {0}` doesn't.
        shell: bash
        run: |
          # Compare against FETCH_HEAD, not `origin/main`: a bare
          # `git fetch origin main` always writes FETCH_HEAD, but only
          # updates the remote-tracking ref when the remote's configured
          # refspec covers it, so `origin/main` can be stale here.
          git fetch --quiet origin main
          tag_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse FETCH_HEAD)"
          # Log both sides so a future failure is diagnosable from the
          # run alone, without re-resolving refs that may have moved.
          echo "tag ${PUBLISH_REF} -> ${tag_sha}"
          echo "origin/main          -> ${main_sha}"
          if ! git merge-base --is-ancestor "$tag_sha" "$main_sha"; then
            echo "::error::${PUBLISH_REF} points at a commit that is not on main; refusing to publish" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Mint crates.io OIDC token
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      # `cargo publish --workspace` has no `--skip-existing`, so a
      # single-package release cycle errors when it reaches the unchanged
      # siblings. `cargo release publish` skips already-published members
      # and publishes the rest leaf-first. Version is pinned so a future
      # upstream behavior change in the skip path surfaces in PR review
      # rather than breaking partial-publish recovery silently. Bump it by
      # hand: nothing updates it automatically, since Renovate's managers
      # read `uses:`, never `run:` bodies.
      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked

      # `cargo release publish` doesn't forward `--locked` to its
      # underlying `cargo publish` invocations, so a stale Cargo.lock
      # could resolve a different dep graph than the version-pull-request-
      # reviewed state. Fail here before an irreversible publish.
      - name: Verify lockfile matches manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      # `--allow-branch 'main,HEAD'`: a tag checkout detaches HEAD, and
      # cargo-release 1.1.2 reads that as branch `HEAD`; dropping it would
      # break every publish.
      #
      # A release that bumps N crates pushes N tags, and each tag fires its
      # own publish run against the whole workspace. The first run publishes
      # everything; the rest find every member already on crates.io, skip
      # them all, and `cargo release` exits 2 with "no packages selected" —
      # red for a release that fully succeeded. Observed on 0.4.0, where
      # linesmith-core/v0.4.0 published both crates and linesmith/v0.4.0
      # then failed with nothing left to do.
      #
      # Counting, rather than testing that the phrase appears at all, is the
      # load-bearing part. cargo-release 1.1.2 (the pinned version) warns
      # "disabled due to previous publish" per already-on-crates.io member,
      # but several routes drop a member from the selection while logging at
      # `debug`/`trace` — invisible at default verbosity, e.g. a stray
      # `[package.metadata.release] release = false`. An existence check
      # would read one crate's warning as covering a sibling that was
      # silently dropped and never published. Requiring one warning per
      # publishable member makes the notice's claim checkable.
      #
      # Safe because, in the pinned source, an empty selection errors before
      # publishing anything, and an index outage reads as unpublished.
      #
      # Gating publish to a single tag would be the wrong fix —
      # linesmith-plugin versions independently, so a plugin-only release
      # pushes one tag that must still publish.
      - name: Publish bumped crates to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          log="$(mktemp)"
          # `tee`, not a captured substitution: a cancelled run is the only
          # kill switch for an in-flight crates.io push, and buffering would
          # discard the log of the one operation here that cannot be undone.
          cargo release publish --workspace --execute --no-confirm --allow-branch 'main,HEAD' 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] && exit 0

          # Matched without cargo-release's `error: ` prefix: that is rendered
          # through anstream, so forcing colour (CARGO_TERM_COLOR=always) would
          # wrap it in escapes and break the match. The phrase alone is unique.
          if ! grep -q 'no packages selected' "$log"; then
            exit "$status"
          fi

          # Same filter `verify-published` applies, so both jobs agree on
          # which members are expected to reach crates.io.
          expected="$(cargo metadata --no-deps --format-version 1 |
            jq '[.packages[] | select(.publish == null or (.publish | index("crates-io")))] | length')"
          skipped="$(grep -c 'disabled due to previous publish' "$log")"

          # Checked before it is compared, so a metadata or jq failure reports
          # itself rather than surfacing as a shortfall — which would send the
          # reader hunting for a dropped crate that does not exist.
          if ! [[ "$expected" =~ ^[0-9]+$ ]] || [ "$expected" -eq 0 ]; then
            echo "::error::Could not determine the publishable member count from cargo metadata; refusing to interpret the empty selection." >&2
            exit "$status"
          fi

          if [ "$skipped" -eq "$expected" ]; then
            echo "::notice::All ${expected} publishable members already carry their manifest version on crates.io; nothing to publish."
            exit 0
          fi

          echo "::error::Publish selected nothing, but only ${skipped} of ${expected} publishable members were skipped as already-published. A member may have been dropped from the release." >&2
          exit "$status"
