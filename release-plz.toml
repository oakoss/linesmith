[workspace]
# cargo-dist creates the GitHub Release, not release-plz
git_release_enable = false
# Tag push triggers cargo-dist's release.yml workflow
git_tag_enable = true
# Generate/update CHANGELOG.md from conventional commits (delegates to git-cliff via cliff.toml)
changelog_update = true
changelog_config = "cliff.toml"
# Update dependency versions in Cargo.lock on release
dependencies_update = true
# No public library API yet to semver-check against
semver_check = false
# Only trigger a release when commits change runtime behavior.
# docs/chore/test/ci are visible in git log only.
# Commit-type allowlist matches AGENTS.md + cog.toml.
release_commits = "^(feat|fix|perf|refactor)"
# Label release PRs for easy filtering
pr_labels = ["release"]

# Force lockstep across the workspace. Without this, a major bump (e.g.
# v0.1.x → v0.2.0 from a `feat!`) on linesmith-core can drag the shared
# `workspace.package.version` field across the caret boundary while
# release-plz leaves a sibling at the old version in its plan (because
# the sibling had no `release_commits` match). The internal dep specs
# then reject the new candidate (`^0.1.3` doesn't accept 0.2.0) and
# `cargo update` fails during the pre-tag step.

[[package]]
name = "linesmith-core"
version_group = "workspace"

[[package]]
name = "linesmith-plugin"
version_group = "workspace"

[[package]]
name = "linesmith"
version_group = "workspace"
