title = "linesmith gitleaks config"

[allowlist]
description = """
Suppress generic-api-key false positives on bead ids and memory keys
(e.g. 'lsm-9zvh-warn-dedupe') wherever they appear — commit messages,
docs, and code comments. regexTarget = 'match'
narrows the suppression to the matching SUBSTRING, so a real secret
pasted into a bead description (which wouldn't match this shape)
still trips the scan.
"""
regexTarget = "match"
regexes = [
  '''lsm-[a-z0-9]{3,5}-[a-z0-9-]+''',
]
