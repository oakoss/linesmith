title = "linesmith gitleaks config"

# Default ruleset is loaded when no [extend] section is present.

[allowlist]
description = """
Suppress generic-api-key false positives on bead memory keys (e.g.
'lsm-9zvh-warn-dedupe' in .beads/issues.jsonl). regexTarget = 'match'
narrows the suppression to the matching SUBSTRING, so a real secret
pasted into a bead description (which wouldn't match this shape)
still trips the scan.
"""
regexTarget = "match"
regexes = [
  '''lsm-[a-z0-9]{3,5}-[a-z0-9-]+''',
]
