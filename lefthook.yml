output:
  - failure
  - execution_out

# Beads integration delegates to .lefthook/bd-hook.sh, which wraps
# `bd hooks run <event>` with the same exit-code and timeout handling
# beads uses in its own shim (.beads/hooks/*):
#   - exit 3   → beads db not initialized; swallow (no-op)
#   - exit 124 → timeout; swallow (proceed without beads)
# Env vars per command: BD_GIT_HOOK=1 signals beads it's in a hook;
# TERM=dumb suppresses TTY escape codes.

pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      glob: '**/*.rs'
      # rustfmt (not `cargo fmt --all`) to scope to staged files and avoid
      # post-commit drift; edition derived because rustfmt ignores Cargo.toml.
      run: rustfmt --edition "$(cargo metadata --no-deps --format-version 1 | jq -er '[.packages[].edition] | unique | if length == 1 then .[0] else error("expected exactly one workspace edition") end')" {staged_files}
      stage_fixed: true
    lint-md:
      glob: '**/*.md'
      run: markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    format:
      glob: '**/*.{md,json,yaml,yml}'
      # Symlinks aren't formattable by prettier (errors on --write).
      exclude:
        - crates/linesmith/CHANGELOG.md
      run: prettier --write {staged_files}
      stage_fixed: true
    shellcheck:
      glob: '**/*.sh'
      run: shellcheck {staged_files}
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh pre-commit

commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file {1}

prepare-commit-msg:
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh prepare-commit-msg {1} {2} {3}

post-merge:
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh post-merge {1}

post-checkout:
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh post-checkout {1} {2} {3}

pre-push:
  parallel: true
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      # The `bd dolt push` is chained here rather than run as a sibling
      # command: `parallel: true` would race it against the hook chain
      # above on the same Dolt database, and the lock contention would
      # surface as an intermittent sync failure that the `||` below then
      # swallows.
      #
      # bd's own pre-push chain does not replicate the database (verified
      # 2026-08-05: a hook run left the remote's refs/dolt/data unchanged;
      # an explicit push advanced it), so issue state only ever reached
      # the remote by hand. The push never fails the git push — shipping
      # code must not depend on the issue tracker being reachable — but it
      # reports, because a silent sync failure looks exactly like a
      # working one.
      #
      # Only fires on `git push`, so a session that changes issues without
      # committing code still needs `bd dolt push`.
      run: '.lefthook/bd-hook.sh pre-push {1} {2} && { bd dolt push || echo "beads — dolt push failed; run bd dolt push manually" >&2; }'
