output:
  - failure
  - execution_out
  # Without this, a glob matching nothing looks identical to a check that passed.
  - skips

# Beads integration delegates to .lefthook/bd-hook.sh, which wraps
# `bd hooks run <event>` with the same exit-code and timeout handling
# beads uses in its own shim (.beads/hooks/*):
#   - exit 3   → beads db not initialized; swallow (no-op)
#   - exit 124 → timeout; swallow (proceed without beads)
# Env vars per command: BD_GIT_HOOK=1 signals beads it's in a hook;
# TERM=dumb suppresses TTY escape codes.

pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      glob: '{**/*.rs,*.rs}'
      # rustfmt (not `cargo fmt --all`) to scope to staged files and avoid
      # post-commit drift; edition derived because rustfmt ignores Cargo.toml.
      # skip_children is what makes the staged-files claim true: without it
      # rustfmt follows `mod` declarations and rewrites unstaged siblings.
      run: rustfmt --config=skip_children=true --edition "$(cargo metadata --no-deps --format-version 1 | jq -er '[.packages[].edition] | unique | if length == 1 then .[0] else error("expected exactly one workspace edition") end')" {staged_files}
      stage_fixed: true
    lint-md:
      glob: '{**/*.md,*.md}'
      # Markdown has one owner. Both tools write and both stage, so splitting
      # them across two jobs under `parallel: true` let them race for the file
      # and for the git index; sequenced here, the order is defined and the
      # staging happens once. prettier honours .prettierignore even for paths
      # named explicitly, so the Knope-owned CHANGELOGs pass through untouched.
      run: markdownlint-cli2 --fix {staged_files} && prettier --write {staged_files}
      stage_fixed: true
    format:
      glob: '{**/*.{json,yaml,yml},*.{json,yaml,yml}}'
      run: prettier --write {staged_files}
      stage_fixed: true
    shellcheck:
      glob: '{**/*.sh,*.sh}'
      run: shellcheck {staged_files}
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh pre-commit

commit-msg:
  commands:
    conventional-commit:
      run: cog verify --ignore-merge-commits --ignore-fixup-commits --file {1}

prepare-commit-msg:
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh prepare-commit-msg {1} {2} {3}

post-merge:
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh post-merge {1}

post-checkout:
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      run: .lefthook/bd-hook.sh post-checkout {1} {2} {3}

pre-push:
  parallel: true
  commands:
    beads:
      env:
        BD_GIT_HOOK: '1'
        TERM: dumb
      # Chained rather than run as a sibling command: `parallel: true`
      # would race the Dolt push against the hook chain above on the same
      # database, and the lock contention would surface as an intermittent
      # sync failure. `bd-dolt-push.sh` never fails, so a push it can't
      # complete reports without blocking `git push`, and it skips pushes
      # aimed anywhere but the beads sync remote — see the script for why.
      #
      # `{2}` is git's own destination URL for this push, which already
      # accounts for pushurl and insteadOf; the script prefers it over
      # resolving the remote name a second time.
      #
      # Only fires on `git push`, so a session that changes issues without
      # committing code still needs `bd dolt push`.
      run: '.lefthook/bd-hook.sh pre-push {1} {2} && .lefthook/bd-dolt-push.sh {1} {2}'
