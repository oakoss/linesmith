[tools]
rust = "stable"
node = "26.1.0"
"npm:prettier" = "3.8.3"
"npm:markdownlint-cli2" = "0.22.1"
lefthook = "2.1.6"
"cargo:cocogitto" = "7"
"cargo:knope" = "0.22.4"
shellcheck = "0.11.0"
hyperfine = "1.20.0"
jq = "1.8.1"

[tasks.fmt]
description = "Format all non-Rust files"
run = "prettier -uwl ."

[tasks."fmt:check"]
description = "Check formatting"
run = "prettier -uc ."

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:sh"]

[tasks."lint:md"]
description = "Lint markdown files"
run = "markdownlint-cli2 '**/*.md' '#node_modules'"

[tasks."lint:md:fix"]
description = "Lint and fix markdown files"
run = "markdownlint-cli2 --fix '**/*.md' '#node_modules'"

# The pre-commit hook shellchecks *staged* files only, which misses an
# unstaged edit, a `--no-verify` push, and any tree where hooks aren't
# installed. `git ls-files` rather than a glob so `target/` and vendored
# scripts stay out; `.beads/hooks/*` is listed separately because those
# scripts are shell without carrying a `.sh` extension.
#
# `-z` / `xargs -0` rather than word-splitting: `git ls-files` C-escapes
# non-ASCII paths under the default `core.quotePath`, so splitting on
# whitespace mangles any accented or CJK filename into arguments that
# don't exist.
#
# `--others` so a script still being iterated on is linted before it is
# staged; an empty match is a hard error because a repo that registers a
# shell linter has shell to lint, and a selector that quietly stops
# matching would keep both `lint` and CI green over unlinted scripts.
[tasks."lint:sh"]
description = "Lint shell scripts"
run = '''
set -e
set -- '*.sh' '.beads/hooks/*'
# A failed `git ls-files` also yields empty output, so the two are separated:
# blaming the pathspec would send the reader to edit the one thing that is
# not wrong.
if ! matches="$(git ls-files --cached --others --exclude-standard -- "$@")"; then
  echo >&2 "lint:sh: git ls-files failed — not a git repository, or git is unavailable"
  exit 1
fi
if [ -z "$matches" ]; then
  echo >&2 "lint:sh: no shell scripts matched — the selector is stale"
  exit 1
fi
git ls-files -z --cached --others --exclude-standard -- "$@" | xargs -0 shellcheck --
'''

# Shell hooks run on every push but are invisible to the Rust suite. The
# watchdog in bd-dolt-push.sh has shipped a process-leak bug twice, and both
# times it was a process-table assertion — not code review, not exit codes —
# that would have caught it.
#
# Both shells explicitly, because they take different halves of the watchdog:
# bash-as-sh grants job control and uses the process-group kill, while dash
# declines it and falls through to the tree walk. Relying on the OS matrix to
# cover both would silently drop half the coverage the day a runner image
# changes its /bin/sh.
[tasks."test:sh"]
description = "Run shell hook contract tests"
run = '''
set -e
./scripts/test-bd-dolt-push.sh /bin/sh
if command -v dash >/dev/null 2>&1; then
  ./scripts/test-bd-dolt-push.sh "$(command -v dash)"
else
  echo "test:sh: dash not installed — process-group-less path not exercised" >&2
fi
'''

[tasks."cargo:fmt"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."cargo:fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."cargo:clippy"]
description = "Run clippy lints"
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."cargo:check"]
description = "Type-check Rust code"
run = "cargo check --locked --workspace --all-targets"

[tasks."cargo:test"]
description = "Run Rust tests"
run = "cargo test --locked --workspace"

[tasks."cargo:test:doc"]
description = "Run Rust doc tests (excluded by --all-targets)"
run = "cargo test --locked --workspace --doc"

[tasks."cargo:bench"]
description = "Run Rust benchmarks"
run = "cargo bench --workspace"

# `config.schema.json` lives at the repo root and is consumed by editor
# integrations (taplo / VS Code / Zed) via the `#:schema` directive
# `linesmith init` writes into user configs. The schema is derived
# from `crate::config::Config` via schemars; CI pins it against drift
# so a schema-affecting type change can't ship without regenerating.
[tasks."schema:update"]
description = "Regenerate config.schema.json from Rust types"
# Atomic write via tempfile + mv. Direct shell redirect would
# truncate config.schema.json *before* cargo runs, leaving the repo
# with an empty schema if the generator fails to build. `set -e`
# is load-bearing: without it, a cargo crash mid-stream still lets
# `mv` proceed with a partially-written tempfile, replacing the
# committed schema with corrupt bytes.
run = '''
set -e
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
cargo run --quiet --locked --bin gen-config-schema -p linesmith > "$tmp"
mv "$tmp" config.schema.json
'''

[tasks."schema:check"]
description = "Fail if config.schema.json drifts from Rust types"
# Generate to a temp file rather than process substitution: mise tasks
# run under sh, which doesn't support `<(…)`. On drift, print a hint
# pointing at `mise run schema:update`. `set -e` ensures a generator
# crash short-circuits before the diff (and yields the cargo error,
# not a misleading drift report).
run = '''
set -e
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
cargo run --quiet --locked --bin gen-config-schema -p linesmith > "$tmp"
if ! diff -u config.schema.json "$tmp" > /dev/null; then
  echo "::error::config.schema.json is stale relative to crate::config types" >&2
  echo "Run 'mise run schema:update' to regenerate." >&2
  diff -u config.schema.json "$tmp" >&2 || true
  exit 1
fi
'''

[tasks.test]
description = "Run all tests"
# Sequential, not parallel-via-depends, so the two cargo invocations
# don't fight over target/ (cargo's per-target lock serializes them
# anyway, but parallel here would just be slower with no upside).
run = ["mise run cargo:test", "mise run cargo:test:doc", "mise run test:sh"]

[tasks.bench]
description = "Run all benchmarks"
depends = ["cargo:bench"]

# End-to-end cold-start measurement: defends the README's `<20ms` claim
# at the level a Claude Code user actually feels — process spawn + ELF
# load + static init + render → stdout. Different signal from the
# in-process Criterion benches (`cargo:bench`), which post-spawn only.
#
# `cwd` is set to a fresh `git init` tempdir (not the caller's checkout)
# so the number doesn't drift with whatever's dirty in the developer's
# tree. Binary path resolves the `.exe` suffix on Windows so contributors
# on bash/Git-Bash see the same task work cross-platform.
[tasks."bench:cold-start"]
description = "Measure end-to-end cold-start wall-clock via hyperfine"
run = '''
set -euo pipefail
cargo build --release --locked -p linesmith
bin="$(pwd)/target/release/linesmith"
[ "${OS:-}" = "Windows_NT" ] && bin="${bin}.exe"
fixture="$(pwd)/crates/linesmith/tests/fixtures/claude_worktree.json"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
(cd "$tmp" && git init -q)
cd "$tmp"
hyperfine \
  --warmup 3 \
  --runs 30 \
  --shell=none \
  --input "$fixture" \
  "$bin"
'''

[tasks.check]
description = "Run all checks (format + lint + Rust + schema)"
depends = ["fmt:check", "lint", "cargo:fmt:check", "cargo:clippy", "cargo:check", "schema:check"]

# CC's statusline spawns the mise shim (~/.cargo/bin/linesmith), so a
# successful `install:*` task is live on the next prompt.

[tasks."install:dev"]
description = "Install linesmith from this source tree (dev iteration loop)"
# --force is required: cargo install skips reinstalling the same version,
# so without it install:dev silently no-ops when a published 0.x.y binary
# already occupies ~/.cargo/bin/linesmith.
run = "cargo install --path crates/linesmith --locked --force"

[tasks."install:dev:checked"]
description = "cargo check first; install dev binary only if check passes"
run = "cargo check --locked --workspace --all-targets && cargo install --path crates/linesmith --locked --force"

[tasks."install:release"]
description = "Install latest published linesmith from crates.io (compiles)"
run = "cargo install linesmith --locked --force"

[tasks."install:release:fast:sh"]
description = "Install latest linesmith release via cargo-dist sh installer (Unix only, prebuilt)"
run = "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/oakoss/linesmith/releases/latest/download/linesmith-installer.sh | sh"

[tasks."install:release:fast:ps1"]
description = "Install latest linesmith release via cargo-dist PowerShell installer (Windows x86_64 only, prebuilt)"
run = "powershell -ExecutionPolicy ByPass -c \"irm https://github.com/oakoss/linesmith/releases/latest/download/linesmith-installer.ps1 | iex\""

[tasks."install:status"]
description = "Show which linesmith binary is active (shim path, version, mtime)"
run = '''
echo "shim path:    $(mise which linesmith)"
echo "version:      $(linesmith --version)"
# stat -f is BSD/macOS; -c is GNU/Linux. Try both.
echo "binary mtime: $(stat -f '%Sm' "$(mise which linesmith)" 2>/dev/null || stat -c '%y' "$(mise which linesmith)")"
'''
