[graph]
all-features = true

[advisories]
yanked = "deny"

# Entries are scoped by advisory ID, never by crate, so a real
# vulnerability in the same dependency still fails. `deny` on the unused
# case makes an entry fail once its advisory stops firing, so a fixed
# upstream forces the removal instead of leaving a stale suppression.
unused-ignored-advisory = "deny"
ignore = [
  # smartstring is unmaintained (archived 2026-05-03), reached through
  # rhai, which requires it outright — 1.24.0 and 1.25.1 both declare
  # `smartstring ^1.0.0` non-optional, so there is no version to move to.
  "RUSTSEC-2026-0249",
]

[licenses]
# Permissive-license allowlist. linesmith ships under MIT/Apache-2.0;
# all entries here are compatible with that distribution model.
# MPL-2.0 / CC0-1.0 / CDLA-Permissive-2.0 are weakly copyleft or
# public-domain-equivalent and apply to transitive deps we don't
# modify (smartstring/uluru/tiny-keccak/webpki-roots).
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
