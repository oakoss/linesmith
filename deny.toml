[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive-license allowlist. linesmith ships under MIT/Apache-2.0;
# all entries here are compatible with that distribution model.
# MPL-2.0 / CC0-1.0 / CDLA-Permissive-2.0 are weakly copyleft or
# public-domain-equivalent and apply to transitive deps we don't
# modify (smartstring/uluru/tiny-keccak/webpki-roots).
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
