[package]
name = "linesmith"
description = "A Rust status line for Claude Code and other AI coding CLIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Sibling crate hosting the segment / theme / layout / data_context
# / config / runtime predicates the CLI driver and doctor both depend
# on. Declared per-crate (not via `[workspace.dependencies]`) so
# release-plz updates the version pin automatically in lockstep
# with linesmith-core's own version on each release.
linesmith-core = { version = "0.1.2", path = "../linesmith-core" }
serde.workspace = true
serde_json.workspace = true
catppuccin.workspace = true
chrono.workspace = true
dialoguer.workspace = true
gix.workspace = true
httpdate.workspace = true
lexopt.workspace = true
rhai.workspace = true
schemars.workspace = true
secrecy.workspace = true
supports-color.workspace = true
supports-hyperlinks.workspace = true
tempfile.workspace = true
terminal_size.workspace = true
ureq.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bin]]
name = "linesmith"
path = "src/main.rs"

[[bench]]
name = "plugins"
harness = false

[[bench]]
name = "render"
harness = false
