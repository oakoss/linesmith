# linesmith preset: developer
# Full developer statusline: model, workspace, context, cost, rate limits,
# and session duration. The `workspace` segment surfaces the worktree name.

[line]
segments = [
  "model",
  "workspace",
  "context_window",
  "cost",
  "session_duration",
  "rate_limit_5h",
  "rate_limit_7d",
]
